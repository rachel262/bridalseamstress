# US site. Shares the AU claims KV and mailer Worker, so US form requests reach Rachel the same way
# (subject starts with "USA", KV keys start with "us-").
name = "bridalseamstress-us"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[kv_namespaces]]
binding = "CLAIMS_KV"
id = "REPLACE_WITH_KV_ID"

[[services]]
binding = "MAILER"
service = "bridalseamstress-mailer"
